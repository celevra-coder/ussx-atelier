<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="gTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EC6F5"/>
      <stop offset="100%" stop-color="#3B6FE8"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B6FE8"/>
      <stop offset="100%" stop-color="#0D1B4B"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EC6F5"/>
      <stop offset="100%" stop-color="#1A3A6B"/>
    </linearGradient>
    <linearGradient id="gLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8E63D"/>
      <stop offset="100%" stop-color="#3B6FE8"/>
    </linearGradient>
  </defs>
  <!-- Top face -->
  <polygon points="40,8 68,24 40,40 12,24" fill="url(#gTop)" opacity="0.9"/>
  <!-- Left face -->
  <polygon points="12,24 40,40 40,68 12,52" fill="url(#gLeft)" opacity="0.85"/>
  <!-- Right face -->
  <polygon points="40,40 68,24 68,52 40,68" fill="url(#gRight)" opacity="0.85"/>
  <!-- Diagonal accent lines -->
  <line x1="40" y1="8" x2="68" y2="52" stroke="url(#gLine)" stroke-width="1.5" opacity="0.7"/>
  <line x1="12" y1="24" x2="40" y2="68" stroke="url(#gLine)" stroke-width="1.5" opacity="0.7"/>
  <!-- Connector dots -->
  <circle cx="40" cy="8" r="3" fill="#A8E63D"/>
  <circle cx="12" cy="24" r="3" fill="#1A5C2A"/>
  <circle cx="68" cy="24" r="3" fill="#6EC6F5"/>
  <circle cx="40" cy="68" r="3" fill="#A8E63D"/>
</svg>
