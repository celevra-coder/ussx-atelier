<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="USSX ателие">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#13203f"/>
      <stop offset="60%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#070A14"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B6FE8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6EC6F5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A8E63D" stop-opacity="0.30"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#3B6FE8" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#beam)"/>
  <!-- isometric cube echoing the logo -->
  <g transform="translate(800 430)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M0 -150 L130 -75 L130 75 L0 150 L-130 75 L-130 -75 Z" stroke="#3B6FE8" stroke-opacity="0.5"/>
    <path d="M0 -150 L0 0 M130 -75 L0 0 M-130 -75 L0 0" stroke="#6EC6F5" stroke-opacity="0.5"/>
    <path d="M-130 -75 L0 -150 L130 -75 L0 0 Z" stroke="#A8E63D" stroke-opacity="0.6"/>
    <circle cx="0" cy="-150" r="9" fill="#1A5C2A"/>
    <circle cx="130" cy="-75" r="9" fill="#1A5C2A"/>
    <circle cx="-130" cy="-75" r="9" fill="#1A5C2A"/>
  </g>
  <rect width="1600" height="900" fill="#0A0E1A" fill-opacity="0.15"/>
</svg>